<mat-form-field appearance="outline">
  <mat-label>{{ label }}</mat-label>

  @if (prefixIcon) {
    <mat-icon matPrefix>
      {{ prefixIcon }}
    </mat-icon>
  }

  <input
    matInput
    [type]="inputType"
    [placeholder]="placeholder"
    [required]="required"
    [value]="value"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />

  @if (showPasswordToggle && type === 'password') {
    <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
      <mat-icon>
        {{ passwordVisible ? 'visibility_off' : 'visibility' }}
      </mat-icon>
    </button>
  }
</mat-form-field>

<!-- TEST ERROR -->
@if (hasError('required')) {
  <div class="error-message">{{ label }} is required</div>
}

@if (hasError('email')) {
  <div class="error-message">Enter a valid email address</div>
}

@if (hasError('minlength')) {
  <div class="error-message">{{ label }} must be at least 6 characters</div>
}
