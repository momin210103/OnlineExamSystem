<div class="dashboard-container">
  <section class="welcome-section">
    <div>
      <p class="welcome-label">Welcome back </p>

      <h1>Student Dashboard</h1>

      <p>Continue your learning journey and track your exam progress.</p>
    </div>

    <button mat-flat-button color="primary">Browse Exams</button>
  </section>

  <section class="stats-grid">
    <mat-card>
      <mat-card-content>
        <mat-icon>assignment</mat-icon>

        <div>
          <span>Total Exams</span>
          <strong>12</strong>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card>
      <mat-card-content>
        <mat-icon>check_circle</mat-icon>

        <div>
          <span>Completed</span>
          <strong>8</strong>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card>
      <mat-card-content>
        <mat-icon>schedule</mat-icon>

        <div>
          <span>Pending</span>
          <strong>4</strong>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card>
      <mat-card-content>
        <mat-icon>emoji_events</mat-icon>

        <div>
          <span>Average Score</span>
          <strong>82%</strong>
        </div>
      </mat-card-content>
    </mat-card>
  </section>

  <section class="recent-section">
    <div class="section-header">
      <h2>Recent Exams</h2>

      <button mat-button color="primary">View All</button>
    </div>

    <mat-card>
      <mat-card-content class="exam-item">
        <div>
          <h3>ASP.NET Core Fundamentals</h3>

          <p>Completed on Oct 5, 2026</p>
        </div>

        <div class="score">
          <strong>85%</strong>
          <span>Score</span>
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</div>
